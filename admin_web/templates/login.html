{% extends "base.html" %}
{% block title %}Iniciar sesión — Supabase Backups{% endblock %}
{% block content %}
<div class="sb-login">
  <div class="sb-login-logo" aria-hidden="true">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>
    </svg>
  </div>
  <h1 class="sb-h1" style="font-size:20px">Administración de backups</h1>
  <p class="sb-sub" style="margin-bottom:22px">Acceso restringido. Introduce tus credenciales.</p>

  {% if err_msg %}
  <div class="sb-flash sb-flash-err" style="margin-bottom:18px">{{ err_msg }}</div>
  {% endif %}

  <form method="post" action="/login">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <div class="sb-field">
      <label class="sb-label" for="username">Usuario</label>
      <input class="sb-input" id="username" name="username" required autocomplete="username" placeholder="tu usuario">
    </div>
    <div class="sb-field">
      <label class="sb-label" for="password">Contraseña</label>
      <input class="sb-input" id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="sb-btn sb-btn-primary" style="width:100%; padding:10px">Entrar</button>
  </form>
</div>
{% endblock %}
