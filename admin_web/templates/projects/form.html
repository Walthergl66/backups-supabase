{% extends "base.html" %}
{% block title %}Proyecto — Supabase Backups{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">{{ 'Nuevo proyecto' if not project else 'Editar proyecto: ' ~ project.slug }}</h1>

<div class="max-w-xl bg-white rounded-lg shadow p-6">
  <form method="post" action="{{ '/projects/create' if not project else '/projects/' ~ project.id ~ '/update' }}" class="space-y-4">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <div class="grid md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1">Slug (identifica en el bot)</label>
        <input name="slug" value="{{ project.slug if project else '' }}" required
               pattern="[a-z0-9][a-z0-9_-]*"
               class="w-full rounded border border-slate-300 px-3 py-2 text-sm font-mono">
        <p class="text-xs text-slate-400 mt-1">Minúsculas, números, guiones. Ej.: mi_app_prod</p>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Nombre</label>
        <input name="nombre" value="{{ project.nombre if project else '' }}" required class="w-full rounded border border-slate-300 px-3 py-2 text-sm">
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Cuenta de Supabase</label>
      <select name="account_id" required class="w-full rounded border border-slate-300 px-3 py-2 text-sm">
        {% for a in accounts %}
        <option value="{{ a.id }}" {% if project and project.account_id == a.id %}selected{% endif %}>{{ a.nombre }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">
        Cadena de conexión PostgreSQL (pooler)
        {% if project %}<span class="text-slate-400">(actual cifrada: {{ project.connection_masked }} — vacío para no cambiar)</span>{% endif %}
      </label>
      <input name="connection" type="text" placeholder="postgresql://postgres.xxxx:password@aws-0-us-east-1.pooler.supabase.com:5432/postgres"
             {% if not project %}required{% endif %}
             class="w-full rounded border border-slate-300 px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">project_ref (Management API)</label>
      <input name="project_ref" value="{{ project.project_ref if project else '' }}" required class="w-full rounded border border-slate-300 px-3 py-2 text-sm font-mono">
    </div>
    <div class="flex items-center gap-4">
      <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" name="activo" value="1" class="rounded" {% if not project or project.activo %}checked{% endif %}>
        Activo (visible para el bot)
      </label>
    </div>
    <div class="flex gap-2">
      <button class="rounded bg-cyan-700 hover:bg-cyan-800 text-white px-4 py-2 text-sm font-semibold">Guardar</button>
      <a href="/projects" class="rounded bg-slate-200 hover:bg-slate-300 px-4 py-2 text-sm">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
