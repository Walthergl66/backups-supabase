services:
  supabase-backups:
    build: .
    image: supabase-backups:latest
    container_name: supabase-backups
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data       # SQLite + backups persistidos fuera del contenedor
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/login', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s