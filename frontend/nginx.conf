worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    # Compresión de HTML/JS/CSS/JSON/SVG/fuentes (text/html siempre incluido).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json font/woff2;

    access_log /dev/stdout;

client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    # A5 (anti-scanning): límites por IP sobre el proxy y el login.
    # api_scan bloquea ráfagas anómalas hacia cualquier ruta /api/*.
    # login_lim aplica un límite más estricto al endpoint de login.
    limit_req_zone $binary_remote_addr zone=api_scan:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=login_lim:10m rate=5r/m;

    # D (confiabilidad de IP): nginx deriva la IP real del cliente desde
    # X-Forwarded-For solo cuando el peer es uno de los proxies confiados
    # (loopback/red privada): publicación Docker, `tailscale serve` y LAN.
    # Un cliente externo que envíe ese header a mano NO es tenido en cuenta:
    # nginx recalcula y reenvía un único valor verificado al backend.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 127.0.0.1/32;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

# X-Forwarded-Proto hacia el backend: si viene de un proxy TLS confiado
    # (tailscale serve termina HTTPS y envía '"X-Forwarded-Proto": "https"'),
    # se preserva; si no, se usa el esquema que ve nginx (HTTP local).
    # $scheme al cuadrado habría aplanado el acceso por Tailscale a HTTP.
    map $http_x_forwarded_proto $forwarded_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
    }

server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Cabeceras de seguridad (M5): SPA y proxy /api
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        # CSP: la SPA solo carga su propio origen; scripts externos no.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        # HSTS: el acceso real es HTTPS vía 'tailscale serve'; un año, sin preload.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # index.html sin caché (los assets llevan hash; el navegador siempre revalida el shell)
        location = /index.html {
            expires -1;
        }

        # Assets con hash de contenido (Vite): caché de 1 año e immutable.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy same-origin always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # La SPA se encarga del routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy reverso hacia la API del backend
        location /api/ {
            limit_req zone=api_scan burst=90 nodelay;
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $realip_remote_addr;
            proxy_set_header X-Forwarded-For $realip_remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            # BACKUP_TIMEOUT_SECONDS=600 por defecto: el proxy no debe cortar
            # una respuesta de /api que espere la finalización de un backup.
            proxy_read_timeout 660s;
        }

        # Login: límite estricto adicional (complementa a slowapi en el backend)
        location = /api/auth/login {
            limit_req zone=login_lim burst=6 nodelay;
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $realip_remote_addr;
            proxy_set_header X-Forwarded-For $realip_remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 660s;
        }

        # SW del PWA: no cachear para permitir actualizaciones
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy same-origin always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            try_files $uri $uri/ =404;
        }
    }
}